<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cutis Lens{% endblock %} · Cutis Lens</title>
  <meta name="description" content="Cutis Lens: explainable AI acne severity analysis (educational prototype).">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<a class="visually-hidden-focusable skip-link" href="#main">Skip to content</a>
<nav class="navbar navbar-expand-md cl-nav">
  <div class="container">
    <a class="navbar-brand brand" href="{{ url_for('index') }}">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="14" cy="14" r="9" class="m-ring"/><circle cx="14" cy="14" r="4" class="m-dot"/><path d="M21 21l7 7" class="m-handle"/></svg>
      Cutis&nbsp;Lens
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
    <div id="nav" class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto align-items-md-center gap-md-1">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('analyze_page') }}">Analyze</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('about') }}">Methodology</a></li>
        <li class="nav-item ms-md-2"><a class="btn btn-cl btn-sm" href="{{ url_for('analyze_page') }}">Start analysis</a></li>
      </ul>
    </div>
  </div>
</nav>
<main id="main">{% block content %}{% endblock %}</main>
<footer class="cl-footer">
  <div class="container">
    <p class="mb-1"><strong>Educational prototype, not a medical device.</strong> {{ disclaimer }}</p>
    <p class="mb-0 small text-muted">Cutis Lens · final-year AI/ML project · images are processed in memory and are not stored.</p>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
